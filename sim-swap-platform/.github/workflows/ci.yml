name: verify
on: [push, pull_request]
permissions: {contents: read}
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements-lock.txt
      - run: python -m ruff check backend ml scripts
      - run: python -m pytest -q --junitxml=reports/tests.xml
      - run: python -m compileall -q backend ml scripts
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci && npm run build && npm audit --audit-level=high
        working-directory: frontend
      - run: python -m pip_audit -r requirements-lock.txt
      - uses: actions/upload-artifact@v4
        with: {name: verification, path: reports/}
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sim-shield:ci .
      - uses: aquasecurity/trivy-action@0.33.1
        with: {image-ref: 'sim-shield:ci', format: cyclonedx, output: sbom-image.json}
      - uses: aquasecurity/trivy-action@0.33.1
        with: {scan-type: fs, scanners: secret, scan-ref: '.', exit-code: '1'}
      - uses: aquasecurity/trivy-action@0.33.1
        with: {image-ref: 'sim-shield:ci', severity: 'HIGH,CRITICAL', exit-code: '1'}
      - uses: actions/upload-artifact@v4
        with: {name: image-sbom, path: sbom-image.json}
